# ═══════════════════════════════════════════
#  CONFIGURATION BASE DE DONNÉES H2
# ═══════════════════════════════════════════

# URL JDBC : base en mémoire nommée "userdb"
jdbc.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1

# Driver JDBC H2
jdbc.driver=org.h2.Driver

# Identifiants par défaut H2
jdbc.username=sa
jdbc.password=

# Pool de connexions HikariCP
jdbc.pool.maxSize=10
jdbc.pool.minIdle=2
jdbc.pool.timeout=30000

# ═══════════════════════════════════════════
#  CONFIGURATION HIBERNATE
# ═══════════════════════════════════════════

# Dialecte SQL pour H2
hibernate.dialect=org.hibernate.dialect.H2Dialect

# Crée/met à jour les tables automatiquement
hibernate.hbm2ddl.auto=update

# Affiche les requêtes SQL dans la console
hibernate.show_sql=true

# Formate joliment le SQL
hibernate.format_sql=true